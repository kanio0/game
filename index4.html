<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <title>Dream</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body,
        html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-shadow: 0 0 5px rgba(0, 0, 0, 0.7);
        }

        #end {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-start;
            padding: 40px;
            color: #fffeff;
            text-shadow: none;
            width: 1280px;
            height: 720px;
            background: url('img/end.png') center/cover no-repeat;
        }

        #end p {
            font-size: 24px;
            margin: 0 0 10px;
            text-align: left;
        }
    </style>
</head>

<body>
    <div id="end" class="screen" style="flex-direction: column;">
        <p>Оказалось, что все это было сном семилетней девочки перед праздником.</p>
        <p>Как только она проснулась - мама позвала ее смотреть красивые салюты за окном и праздновать Новый год.</p>
    </div>
</body>

</html>
